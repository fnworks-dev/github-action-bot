name: SideQuest Backfill Summaries

on:
  workflow_dispatch:
    inputs:
      since:
        description: "Backfill rows created_at >= this date (YYYY-MM-DD)"
        required: true
        default: "2026-03-12"
      limit:
        description: "Max rows to process"
        required: true
        default: "200"
      dry_run:
        description: "If true, does not write updates"
        required: true
        default: "true"
      sleep_ms:
        description: "Delay between rows (ms)"
        required: true
        default: "500"

jobs:
  backfill:
    if: github.repository == 'fnworks-dev/github-action-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./sidequest-bot
        run: npm ci

      - name: Build
        working-directory: ./sidequest-bot
        run: npm run build

      - name: Backfill summaries
        working-directory: ./sidequest-bot
        env:
          TURSO_DATABASE_URL: ${{ secrets.SIDEQUEST_TURSO_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.SIDEQUEST_TURSO_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_BACKUP_KEY_1: ${{ secrets.GEMINI_BACKUP_KEY_1 }}
          GEMINI_BACKUP_KEY_2: ${{ secrets.GEMINI_BACKUP_KEY_2 }}
          NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
          NIM_MODEL: nvidia/nemotron-3-super-120b-a12b
          NIM_MODELS: nvidia/nemotron-3-super-120b-a12b,nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
          SIDEQUEST_AI_MAX_ATTEMPTS: '2'
          SIDEQUEST_AI_TIMEOUT_MS: '15000'
          BACKFILL_SINCE: ${{ inputs.since }}
          BACKFILL_LIMIT: ${{ inputs.limit }}
          BACKFILL_DRY_RUN: ${{ inputs.dry_run }}
          BACKFILL_SLEEP_MS: ${{ inputs.sleep_ms }}
        run: npm run backfill:summaries

      - name: Alert on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{"content": "🔴 SideQuest Backfill failed — run https://github.com/fnworks-dev/github-action-bot/actions/runs/${{ github.run_id }}"}'
