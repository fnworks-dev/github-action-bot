name: Fallback Verification (temp)

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install + build
        working-directory: ./sidequest-bot
        run: npm ci && npm run build

      - name: Verify fallback chain
        working-directory: ./sidequest-bot
        env:
          NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
          SIDEQUEST_AI_TIMEOUT_MS: '15000'
        run: |
          cat > /tmp/t.mjs << 'SCRIPT_EOF'
          const which = process.argv[2];
          const { generateTextWithFallback } = await import(process.cwd() + "/dist/ai/client.js");
          if (which === "t1") {
            const r = await generateTextWithFallback({ prompt: 'Reply with exactly: OK', temperature: 0, maxOutputTokens: 500, taskLabel: "t1" });
            console.log("T1 got:", JSON.stringify(r.trim().slice(0, 30)));
          } else if (which === "t2") {
            const r = await generateTextWithFallback({ prompt: 'Reply with exactly: OK2', temperature: 0, maxOutputTokens: 500, taskLabel: "t2" });
            console.log("T2 got:", JSON.stringify(r.trim().slice(0, 30)));
          } else {
            await generateTextWithFallback({ prompt: 'x', temperature: 0, maxOutputTokens: 100, taskLabel: "t3" });
            console.log("T3 ERROR: did not throw"); process.exit(1);
          }
          SCRIPT_EOF
          PASS=0; FAIL=0
          note() { if [ "$1" = 0 ]; then PASS=$((PASS+1)); echo "PASS | $2"; else FAIL=$((FAIL+1)); echo "FAIL | $2"; fi }

          echo "--- T1: gemini keys dead -> NIM"
          GEMINI_API_KEY=INVALID-A GEMINI_BACKUP_KEY_1=INVALID-B GEMINI_BACKUP_KEY_2=INVALID-C \
            NIM_MODELS="nvidia/nemotron-3-super-120b-a12b,nvidia/nemotron-3-nano-omni-30b-a3b-reasoning" \
            node /tmp/t.mjs t1 > /tmp/t1.log 2>&1
          note $? "T1 gemini-dead -> NIM serves | $(grep 'T1 got' /tmp/t1.log)"

          echo "--- T2: NIM primary dead (lightning) -> cascade to nano-omni"
          GEMINI_API_KEY=INVALID-A GEMINI_BACKUP_KEY_1=INVALID-B GEMINI_BACKUP_KEY_2=INVALID-C \
            NIM_MODELS="nvidia/nemotron-3.5-lightning-30b-a3b,nvidia/nemotron-3-nano-omni-30b-a3b-reasoning" \
            node /tmp/t.mjs t2 > /tmp/t2.log 2>&1
          note $? "T2 nim primary dead -> cascade backup | $(grep 'T2 got' /tmp/t2.log)"

          echo "--- T3: all dead -> clean throw"
          GEMINI_API_KEY=INVALID-A GEMINI_BACKUP_KEY_1=INVALID-B GEMINI_BACKUP_KEY_2=INVALID-C \
            NIM_API_KEY=INVALID-NIM \
            node /tmp/t.mjs t3 > /tmp/t3.log 2>&1
          if [ $? -ne 0 ] && grep -q "All AI providers failed" /tmp/t3.log; then note 0 "T3 all-dead throws clean error"; else note 1 "T3 all-dead throws clean error | $(tail -1 /tmp/t3.log | head -c 120)"; fi

          echo "SUMMARY: $PASS/3 passed"
          [ "$FAIL" = "0" ]
