name: SideQuest Bot 02 (Voice + Video + Writer)

on:
  schedule:
    # Run every 4 hours at :30
    - cron: '30 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sidequest-bot-02-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-bot:
    if: github.repository == 'fnworks-dev/github-action-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./sidequest-bot
        run: npm ci

      - name: Build
        working-directory: ./sidequest-bot
        run: npm run build

      - name: Run SideQuest Bot 02
        working-directory: ./sidequest-bot
        env:
          TURSO_DATABASE_URL: ${{ secrets.SIDEQUEST_TURSO_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.SIDEQUEST_TURSO_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_BACKUP_KEY_1: ${{ secrets.GEMINI_BACKUP_KEY_1 }}
          GEMINI_BACKUP_KEY_2: ${{ secrets.GEMINI_BACKUP_KEY_2 }}
          NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
          NIM_MODEL: nvidia/nemotron-3-super-120b-a12b
          NIM_MODELS: nvidia/nemotron-3-super-120b-a12b,meta/muse-glimmer-30b
          NVIDIA_NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
          NVIDIA_NIM_MODEL: nvidia/nemotron-3-super-120b-a12b
          CONFIG: '02'
          SIDEQUEST_MAX_SUBREDDITS: '25'
          SIDEQUEST_AI_MAX_ATTEMPTS: '2'
          SIDEQUEST_AI_TIMEOUT_MS: '15000'
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: npm run start:split
      - name: Alert on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d '{"content": "🔴 SideQuest Bot 02 failed — run https://github.com/fnworks-dev/github-action-bot/actions/runs/${{ github.run_id }}"}'
