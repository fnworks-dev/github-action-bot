name: SideQuest Dead-Man Switch

on:
  schedule:
    # Every hour
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  actions: read

concurrency:
  group: sidequest-deadman
  cancel-in-progress: true

jobs:
  check:
    if: github.repository == 'fnworks-dev/github-action-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check workflow freshness
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          STALE_HOURS=8
          NOW=$(date +%s)
          NL=$'\n'
          ALERTS=""

          for WF in sidequest-bot-01.yml sidequest-bot-02.yml sidequest-bot-03.yml sidequest-bot-04.yml; do
            LAST_SUCCESS=$(gh api "repos/${{ github.repository }}/actions/workflows/$WF/runs?status=success&per_page=1" --jq '.workflow_runs[0].created_at' 2>/dev/null)
            if [ -z "$LAST_SUCCESS" ] || [ "$LAST_SUCCESS" = "null" ]; then
              ALERTS="$ALERTS${NL}🔴 $WF: no successful run found"
              continue
            fi
            AGE_H=$(( (NOW - $(date -d "$LAST_SUCCESS" +%s)) / 3600 ))
            echo "$WF: last success ${AGE_H}h ago ($LAST_SUCCESS)"
            if [ "$AGE_H" -ge "$STALE_HOURS" ]; then
              ALERTS="$ALERTS${NL}🔴 $WF: no success in ${AGE_H}h (threshold ${STALE_HOURS}h)"
            fi
          done

          if [ -n "$ALERTS" ]; then
            echo "Alerts:$ALERTS"
            PAYLOAD=$(jq -Rs '{content: ("⏰ SideQuest dead-man switch:" + .)}' <<<"$ALERTS")
            curl -s -X POST "$DISCORD_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD"
          else
            echo "All workflows fresh."
          fi
