name: Research Bot (Problem Discovery)

on:
  # Turned off 2026-10-14: this repo focuses on Sidequestboard bots. Manual runs only.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-bot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-bot:
    if: github.repository == 'fnworks-dev/github-action-bot'
    runs-on: ubuntu-latest
    # A full run takes ~75 min: analysis ~35 (8 posts x 33 subreddits + 50 HN, batches of 5), clustering ~28 (sequential
    # Turso calls per cluster), synthesis ~10, daily summary.
    # ponytail: clustering grows with history; batch the writes in research-bot/src/db/clusters.ts if runs near 120.
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./research-bot
        run: npm ci

      - name: Build
        working-directory: ./research-bot
        run: npm run build

      - name: Run Research Bot
        working-directory: ./research-bot
        env:
          TURSO_DATABASE_URL: ${{ secrets.RESEARCH_TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.RESEARCH_TURSO_AUTH_TOKEN }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_BACKUP_KEY_1: ${{ secrets.GEMINI_BACKUP_KEY_1 }}
          GEMINI_BACKUP_KEY_2: ${{ secrets.GEMINI_BACKUP_KEY_2 }}
          DISCORD_WEBHOOK_URL: ${{ secrets.RESEARCH_DISCORD_WEBHOOK_URL }}
          MIN_RELEVANCE_THRESHOLD: '4'
        run: npm start
