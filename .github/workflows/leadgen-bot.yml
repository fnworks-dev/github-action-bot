name: Leadgen Bot (Reddit + HN)

on:
  # Turned off 2026-10-14: this repo focuses on Sidequestboard bots. Manual runs only.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: leadgen-bot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-bot:
    if: github.repository == 'fnworks-dev/github-action-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: ./leadgen-bot
        run: npm ci

      - name: Build
        working-directory: ./leadgen-bot
        run: npm run build

      - name: Run Lead Bot (Reddit + HN)
        working-directory: ./leadgen-bot
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_BACKUP_KEY_1: ${{ secrets.GEMINI_BACKUP_KEY_1 }}
          GEMINI_BACKUP_KEY_2: ${{ secrets.GEMINI_BACKUP_KEY_2 }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TWITTER_HEALTH_WEBHOOK_URL: ${{ secrets.TWITTER_HEALTH_WEBHOOK_URL }}
          MIN_SCORE_THRESHOLD: "6"
          SOURCES: "reddit,hackernews"
        run: npm start
