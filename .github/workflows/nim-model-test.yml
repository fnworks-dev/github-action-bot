name: NIM Model Test (temp)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Reliability bench
        env:
          NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
        run: |
          set +e
          bench() {
            MODEL="$1"; LABEL="$2"
            OK=0; FAIL=0; TOTAL_T=0
            for i in 1 2 3 4; do
              START=$(date +%s%N)
              CODE=$(curl -s -m 60 -o /tmp/resp.json -w "%{http_code}" \
                https://integrate.api.nvidia.com/v1/chat/completions \
                -H "Authorization: Bearer $NIM_API_KEY" \
                -H "Content-Type: application/json" \
                -d '{
                  "model": "'$MODEL'",
                  "max_tokens": 800,
                  "temperature": 0.1,
                  "messages": [{"role": "user", "content": "Classify this Reddit post. Is the author hiring someone? Reply ONLY JSON {\"isJob\": true|false, \"confidence\": 0.0-1.0}.\n\nTitle: '$i' — '$LABEL' test\nContent: [Hiring] Need logo designer, $200 budget, one week"}]
                }')
              END=$(date +%s%N)
              MS=$(( (END-START)/1000000 ))
              if [ "$CODE" = "200" ] && grep -q '"isJob": true' /tmp/resp.json; then
                OK=$((OK+1)); TOTAL_T=$((TOTAL_T+MS))
                echo "$LABEL call$i: OK ${MS}ms"
              else
                FAIL=$((FAIL+1))
                echo "$LABEL call$i: FAIL HTTP=$CODE $(head -c 150 /tmp/resp.json)"
              fi
            done
            echo ">>> $LABEL: $OK ok / $FAIL fail, avg $(( TOTAL_T / (OK>0?OK:1) ))ms"
          }

          bench "nvidia/nemotron-3-super-120b-a12b" "nemotron3-super"
          bench "meta/muse-glimmer-30b" "muse-glimmer"
          echo DONE
