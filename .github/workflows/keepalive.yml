name: Keep Workflows Alive

on:
  schedule:
    # Run every 14 days — well within GitHub's 60-day inactivity window
    - cron: '0 0 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    if: github.repository == 'fnworks-dev/github-action-bot'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Push keepalive commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive — prevent workflow auto-disable"
          git push
